<!DOCTYPE html>
<html>
<head>
    <title>Cloud App Demo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f7f9fc; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 450px; }
        h1 { color: #333; font-size: 20px; }
        .id { color: #0070f3; font-weight: bold; font-size: 18px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cloud Computing Project Demo</h1>
        <p>This request was handled by Cloud Server / Container ID:</p>
        <p class="id">{{ server_id }}</p>
    </div>
</body>
</html>
